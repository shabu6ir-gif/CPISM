<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        .result-computed {
            background-color: blue;
            font-weight: bold;
        }

        .result-field {
            background-color: brown;
            font-weight: bold;
        }
    </style>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="jquery-4.0.0.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow p-3" style="width: 320px;">
            <h3 class="text-center mb-3">Calculator</h3>

            <input type="number" id="input1" class="form-control form-control-lg text-end mb-3" value="0">

            <input type="number" id="input2" class="form-control form-control-lg text-end mb-3" value="0">

            <input type="text" id="result" class="form-control form-control-lg text-end mb-3" placeholder="Result"
                readonly>

            <div class="row g-2">
                <div class="col-3">
                    <button class="btn btn-danger w-100" id="clear">C</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-secondary w-100" id="divide">÷</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-secondary w-100" id="multiply">×</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-secondary w-100">DEL</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light border w-100">7</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">8</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">9</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-secondary w-100" id="subraction">−</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light border w-100">4</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">5</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">6</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-secondary w-100" id="addition">+</button>
                </div>

                <div class="col-3">
                    <button class="btn btn-light border w-100">1</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">2</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">3</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-primary w-100 h-100" id="equals">=</button>
                </div>

                <div class="col-6">
                    <button class="btn btn-light border w-100">0</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">.</button>
                </div>
                <div class="col-3">
                    <button class="btn btn-light border w-100">%</button>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    $(document).on('click', '#addition', function () {
        var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num1) + parseFloat(num2);
        alert('result is ' + result);
        $('#result').val(resultText);
        $('#input1, #input2').addClass('result-computed');
        $('.result').addClass('result-field');

    });

    $(document).on('click','#subtraction', function(){
       var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num2) - parseFloat(num1);
        alert('result is ' + result);
        $('#result').val(resultText);
        $('#input1, #input2').addClass('result-computed');
        $('.result').addClass('result-field'); 
         resultField()
    });
      $(document).on('click','#multiply', function(){
        var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num2) * parseFloat(num1);
        alert('result is ' + result);
        $('#result').val(resultText);
        $('#input1, #input2').addClass('result-computed');
        $('.result').addClass('result-field');
          resultField()
    });
      $(document).on('click','#addition', function(){
        var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num2) + parseFloat(num1);
        alert('result is ' + result);
        $('#result').val(resultText);
        $('#input1, #input2').addClass('result-computed');
        $('.result').addClass('result-field');
          resultField()
    });
      $(document).on('click','#equals', function(){
        var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num2) = parseFloat(num1);
        alert('result is ' + result);
        $('#result').val(resultText);
        $('#input1, #input2').addClass('result-computed');
        $('.result').addClass('result-field');
          resultField()
    });
      $(document).on('click','#clear', function(){
        var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num2) - parseFloat(num1);
       
        $('#input1, #input2').val(0);
        $('.result') .val('');

        normalizeField('');
    });
        $(document).on('click','#divide', function(){
       var num1 = $('#input1').val();
        var num2 = $('#input2').val();

        var result = parseFloat(num2) / parseFloat(num1);
        alert('result is ' + result);
        $('#result').val(resultText);
        $('#input1, #input2').addClass('result-computed');
        $('.result').addClass('result-field'); 
          resultField()
    });


</script>

</html>
